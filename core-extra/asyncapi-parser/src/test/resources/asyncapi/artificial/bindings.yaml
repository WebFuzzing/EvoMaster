asyncapi: 3.0.0
info:
  title: Channels whose wire address depends on the transport
  version: 1.0.0

servers:
  kafka:
    host: localhost:9092
    protocol: kafka
  rabbit:
    host: localhost:5672
    protocol: amqp
    protocolVersion: 0.9.1

channels:
  # both an address and a Kafka topic: on Kafka the topic must win
  both:
    address: events.declared
    messages:
      event:
        $ref: '#/components/messages/event'
    bindings:
      kafka:
        topic: events.from.binding
      amqp:
        is: routingKey
        exchange:
          name: events.exchange

  # a Kafka binding that declares no topic: the address stands
  emptyTopic:
    address: events.declared
    messages:
      event:
        $ref: '#/components/messages/event'
    bindings:
      kafka:
        partitions: 3

  # no binding at all
  plain:
    address: events.declared
    messages:
      event:
        $ref: '#/components/messages/event'

operations:
  onBoth:
    action: receive
    channel:
      $ref: '#/channels/both'
  onEmptyTopic:
    action: receive
    channel:
      $ref: '#/channels/emptyTopic'
  emitPlain:
    action: send
    channel:
      $ref: '#/channels/plain'

components:
  messages:
    event:
      name: Event
      payload:
        type: object
        properties:
          id:
            type: string
