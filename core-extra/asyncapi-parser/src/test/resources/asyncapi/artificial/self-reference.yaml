asyncapi: 3.0.0
info:
  title: A document that refers to itself by name
  version: 1.0.0

# Some generators write every reference as an absolute one, including those that stay inside
# the document. Following that as if it were another document would import the whole file into
# itself, silently doubling its schemas and messages.

channels:
  c:
    address: c
    messages:
      m:
        $ref: '#/components/messages/m'

operations:
  onC:
    action: receive
    channel:
      $ref: '#/channels/c'

components:
  messages:
    m:
      name: M
      payload:
        $ref: 'self-reference.yaml#/components/schemas/Thing'

  schemas:
    Thing:
      type: object
      properties:
        id:
          type: string
