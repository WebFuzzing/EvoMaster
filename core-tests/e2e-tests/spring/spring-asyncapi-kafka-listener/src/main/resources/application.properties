# The broker's address is given by whoever starts the service: spring.kafka.bootstrap-servers

# Every listener reads its topic from the start the first time it joins. The topics are created
# empty right before the service starts, so nothing published to them is ever skipped, however
# long joining the group takes.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Record values are read into typed objects by JsonDeserializer, each listener naming its own type.
# Wrapped in ErrorHandlingDeserializer, so that a record that cannot be read is logged and skipped,
# rather than failing every poll that would return it.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# What the service publishes is JSON it writes itself, sent as text.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Short, so that the listeners stop quickly when the service does.
spring.kafka.listener.poll-timeout=500

logging.level.org.apache.kafka=WARN
