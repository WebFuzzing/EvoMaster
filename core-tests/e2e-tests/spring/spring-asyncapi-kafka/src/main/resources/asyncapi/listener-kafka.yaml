# An artificial service for the AsyncAPI E2E tests. Written for EvoMaster.
asyncapi: 3.0.0
info:
  title: Listener Kafka API
  version: 1.0.0
  description: |
    One fire-and-forget operation over Kafka: an order is placed, and nothing is answered.
    Every order taken is confirmed on a topic of its own, for whoever is listening.
defaultContentType: application/json

servers:
  kafka:
    host: localhost:9092
    protocol: kafka

channels:
  orderPlaced:
    address: order.placed
    messages:
      orderPlaced:
        $ref: '#/components/messages/orderPlaced'
  orderConfirmed:
    address: order.confirmed
    messages:
      orderConfirmed:
        $ref: '#/components/messages/orderConfirmed'

operations:
  placeOrder:
    action: receive
    channel:
      $ref: '#/channels/orderPlaced'
  confirmOrder:
    action: send
    summary: An order was taken.
    channel:
      $ref: '#/channels/orderConfirmed'

components:
  messages:
    orderPlaced:
      name: OrderPlaced
      contentType: application/json
      payload:
        $ref: '#/components/schemas/OrderPlaced'
    orderConfirmed:
      name: OrderConfirmed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/OrderConfirmed'

  schemas:
    OrderPlaced:
      type: object
      required: [shipping]
      properties:
        shipping: { type: string }
    OrderConfirmed:
      type: object
      required: [status, shipping]
      properties:
        status:
          type: string
          const: CONFIRMED
        shipping: { type: string }
