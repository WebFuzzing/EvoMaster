# An artificial service for the AsyncAPI E2E tests. Written for EvoMaster.
asyncapi: 3.0.0
info:
  title: Listener Kafka API
  version: 1.0.0
  description: |
    One fire-and-forget operation over Kafka: an order is placed, and nothing is answered.
defaultContentType: application/json

servers:
  kafka:
    host: localhost:9092
    protocol: kafka

channels:
  orderPlaced:
    address: order.placed
    messages:
      orderPlaced:
        $ref: '#/components/messages/orderPlaced'

operations:
  placeOrder:
    action: receive
    channel:
      $ref: '#/channels/orderPlaced'

components:
  messages:
    orderPlaced:
      name: OrderPlaced
      contentType: application/json
      payload:
        $ref: '#/components/schemas/OrderPlaced'

  schemas:
    OrderPlaced:
      type: object
      required: [shipping]
      properties:
        shipping: { type: string }
