# Read by ListenerKafkaApplication only. The driver gives the broker address in kafka.bootstrap.
spring.kafka.bootstrap-servers=${kafka.bootstrap}

# The topic is created empty right before the service starts, so reading from the start skips nothing.
spring.kafka.consumer.auto-offset-reset=earliest

# A record that cannot be read is logged and skipped, rather than failing every poll that returns it.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.foo.asyncapi.kafka.listener.OrderPlaced

# Short, so that the listener stops quickly when the service does.
spring.kafka.listener.poll-timeout=500
